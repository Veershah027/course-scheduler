<!DOCTYPE html>
<html>

<head>
    <title>Course Scheduler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>My Courses</h1>
    <a href="/add">+ Add a Course</a>
    {% if courses %}
    <ul>
        {% for course in courses %}
        <li>
    {{ course.code }} - {{ course.title }} ({{ course.days }} {{ course.start_time }}-{{ course.end_time }})
    <br>
    <a href="{{ url_for('edit_course', course_id=course.id) }}">Edit</a> |
    <a href="{{ url_for('delete_course', course_id=course.id) }}" onclick="return confirm('Delete this course?')">Delete</a>
</li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No courses added yet.</p>
    {% endif %}
</body>

</html>
